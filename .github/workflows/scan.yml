name: Flight Radar by Kyudo scan

on:
  schedule:
    - cron: "17 */6 * * *"
    # Retry failed or deferred queue items hourly. Normal items still carry
    # a six-hour next_scan_at, so this runner stays idle without due work.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      reserved_run_id:
        description: "Zarezerwowany identyfikator przebiegu administratora"
        required: false
        type: string
      force_scan:
        description: "Wymuś sprawdzenie wszystkich aktywnych pozycji (większe obciążenie źródła)"
        required: false
        type: boolean
        default: false
      full_queue_scan:
        description: "Jednorazowo przejdź przez całą bieżącą kolejkę (wysokie obciążenie źródła)"
        required: false
        type: boolean
        default: false

concurrency:
  group: friends-backend
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run shared scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          MAX_STANDARD_QUERIES: "800"
          MAX_FIRST_QUERIES: "12"
          MAX_STANDARD_CEILING: "800"
          MAX_FIRST_CEILING: "40"
          GOOGLE_REQUEST_DELAY_SECONDS: "1.5"
          MAX_SCAN_RUNTIME_SECONDS: "3000"
          SCAN_PROGRESS_EVERY: "5"
          GOOGLE_BROWSER_QUERY_LIMIT: ${{ inputs.full_queue_scan == true && '800' || '80' }}
          FULL_QUEUE_SCAN: ${{ inputs.full_queue_scan == true && 'true' || 'false' }}
          FULL_QUEUE_STANDARD_LIMIT: "800"
          FULL_QUEUE_FIRST_LIMIT: "40"
          FORCE_SCAN: ${{ (inputs.force_scan == true || inputs.full_queue_scan == true) && 'true' || 'false' }}
          RESERVED_RUN_ID: ${{ inputs.reserved_run_id || '' }}
        run: python scanner/friends_scanner.py
