name: Flight Radar by Kyudo scan

on:
  schedule:
    - cron: "17 */6 * * *"
    # Retry failed or deferred queue items hourly. Normal items still carry
    # a six-hour next_scan_at, so this runner stays idle without due work.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      reserved_run_id:
        description: "Zarezerwowany identyfikator przebiegu administratora"
        required: false
        type: string
      force_scan:
        description: "Wymuś sprawdzenie wszystkich aktywnych pozycji (większe obciążenie źródła)"
        required: false
        type: boolean
        default: false
      full_queue_scan:
        description: "Jednorazowo przejdź przez całą bieżącą kolejkę (wysokie obciążenie źródła)"
        required: false
        type: boolean
        default: false

concurrency:
  group: friends-backend
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Keep one batch short enough that hourly recovery runs never form a
    # second-day backlog behind a single long browser fallback pass.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run shared scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          # Main scans use the full safe budget. The hourly recovery runner
          # gets a deliberately smaller budget so a parser failure does not
          # turn every hour into another full Google sweep.
          MAX_STANDARD_QUERIES: ${{ github.event.schedule == '47 * * * *' && '400' || '800' }}
          MAX_FIRST_QUERIES: ${{ github.event.schedule == '47 * * * *' && '30' || '150' }}
          MAX_STANDARD_CEILING: ${{ github.event.schedule == '47 * * * *' && '400' || '800' }}
          MAX_FIRST_CEILING: ${{ github.event.schedule == '47 * * * *' && '30' || '150' }}
          GOOGLE_REQUEST_DELAY_SECONDS: "1.5"
          MAX_SCAN_RUNTIME_SECONDS: "1200"
          SCAN_PROGRESS_EVERY: "5"
          # Rendered fallback pages are expensive, but 80 loads were consumed
          # by only a small group of round-trip queries. Keep a bounded 400
          # page budget for normal runs and 800 for an explicit full pass.
          GOOGLE_BROWSER_QUERY_LIMIT: ${{ inputs.full_queue_scan == true && '800' || '400' }}
          FULL_QUEUE_SCAN: ${{ inputs.full_queue_scan == true && 'true' || 'false' }}
          FULL_QUEUE_STANDARD_LIMIT: "800"
          FULL_QUEUE_FIRST_LIMIT: "150"
          FORCE_SCAN: ${{ (inputs.force_scan == true || inputs.full_queue_scan == true) && 'true' || 'false' }}
          RESERVED_RUN_ID: ${{ inputs.reserved_run_id || '' }}
        run: python scanner/friends_scanner.py
