name: Flight Radar by Kyudo scan

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      reserved_run_id:
        description: "Zarezerwowany identyfikator przebiegu administratora"
        required: false
        type: string

concurrency:
  group: friends-backend
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run shared scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          MAX_STANDARD_QUERIES: "240"
          MAX_FIRST_QUERIES: "12"
          MAX_STANDARD_CEILING: "400"
          MAX_FIRST_CEILING: "24"
          GOOGLE_REQUEST_DELAY_SECONDS: "1.5"
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          RESERVED_RUN_ID: ${{ inputs.reserved_run_id || '' }}
        run: python scanner/friends_scanner.py
