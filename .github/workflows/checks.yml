name: Flight Radar by Kyudo checks

on:
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "site/**"
      - "supabase/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scanner/**"
      - "site/**"
      - "supabase/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile scanner
        run: python -m compileall -q scanner tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify rendered Google fallback runtime
        run: python scripts/check_browser_runtime.py
      - name: Verify database retention and learning contract
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -f tests/sql_database_contract.sql
